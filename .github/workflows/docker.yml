name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant.tag }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - tag: cu124
            dockerfile: docker/Dockerfile
          - tag: cu118
            dockerfile: docker/Dockerfile.cuda118

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          tags: ${{ vars.DOCKER_USER }}/visomaster:latest-${{ matrix.variant.tag }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
          cache-from: type=registry,ref=${{ vars.DOCKER_USER }}/visomaster:buildcache-${{ matrix.variant.tag }}
          cache-to: type=registry,ref=${{ vars.DOCKER_USER }}/visomaster:buildcache-${{ matrix.variant.tag }},mode=max

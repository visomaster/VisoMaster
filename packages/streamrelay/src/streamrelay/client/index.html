<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>WebStreamer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item status-indicator">
        <span class="status-dot" id="statusDot"></span>
      </div>
      <div class="stat-item">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="statFps">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Bitrate</span>
        <span class="stat-value" id="statBitrate">0 kbps</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Res</span>
        <span class="stat-value" id="statResolution">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Codec</span>
        <span class="stat-value stat-codec" id="statCodec">—</span>
      </div>
    </div>

    <!-- Video preview — fills all remaining space -->
    <div class="video-container" id="videoContainer">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="video-overlay" id="videoOverlay">
        <div class="overlay-content">
          <div class="logo-icon">WS</div>
          <span>Tap Start to begin streaming</span>
        </div>
      </div>
    </div>

    <!-- Controls panel -->
    <div class="controls-panel" id="controlsPanel">
      <div class="panel-header">
        <div class="panel-title">
          <div class="logo-icon-sm">WS</div>
          <span>WebStreamer</span>
        </div>
        <div class="panel-header-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle light/dark mode" title="Toggle theme">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <button class="icon-btn panel-toggle" id="panelToggle" aria-label="Toggle settings">
            <svg class="chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="panel-body" id="panelBody">
        <div class="select-row">
          <label for="cameraSelect">Camera</label>
          <select id="cameraSelect"></select>
        </div>
        <div class="select-row">
          <label for="resolutionSelect">Resolution</label>
          <select id="resolutionSelect">
            <option value="640x480">640 × 480</option>
            <option value="1280x720" selected>1280 × 720</option>
            <option value="1920x1080">1920 × 1080</option>
          </select>
        </div>
        <div class="select-row">
          <label for="codecSelect">Codec</label>
          <select id="codecSelect">
            <option value="auto" selected>Auto</option>
            <option value="h264">H.264 (WebCodecs)</option>
            <option value="jpeg">JPEG</option>
          </select>
        </div>
        <div class="select-row quality-row" id="qualityRow">
          <label for="qualityRange">Quality <span id="qualityLabel">85%</span></label>
          <input type="range" id="qualityRange" min="30" max="95" step="5" value="85" />
        </div>
      </div>

      <button id="streamBtn" class="btn-stream">
        <span class="btn-stream-icon" id="streamBtnIcon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </span>
        <span id="streamBtnText">Start Streaming</span>
      </button>
    </div>

  </div>
  <script src="/app.js"></script>
</body>
</html>

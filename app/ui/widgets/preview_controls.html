<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Preview Controls</title>
<style>
  :root {
    --bg:        #181818;
    --surface:   #1f1f1f;
    --surface-2: #262626;
    --border:    #2a2a2a;
    --text:      #e2e2e2;
    --muted:     #8a8a8a;
    --accent:    #3b82f6;
    --accent-h:  #2563eb;
    --active:    #1d4ed8;
    --amber:     #f59e0b;
    --radius:    8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 12px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #bar {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    gap: 12px;
  }

  /* Groups */
  .group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .group-label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 6px;
  }

  /* Frame counter */
  .counter {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    min-width: 36px;
    text-align: center;
  }
  .counter.cur { text-align: left; }
  .counter.max { text-align: right; }

  /* Buttons */
  button {
    appearance: none;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    padding: 0;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease, transform 80ms ease;
  }
  button:focus { outline: none; }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Icon button */
  .icon-btn {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover    { background: var(--surface-2); }
  .icon-btn:active   { background: var(--surface); transform: scale(0.96); }
  .icon-btn.is-on    { background: var(--active); border-color: var(--active); color: #fff; }
  .icon-btn svg      { display: block; }

  /* Play button (pill, accent) */
  .play-btn {
    width: 38px;
    height: 38px;
    border-radius: 19px;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 8px rgba(59,130,246,0.25);
  }
  .play-btn:hover  { background: var(--accent-h); }
  .play-btn:active { background: var(--active); transform: scale(0.96); }
  .play-btn.is-on  { background: var(--active); }

  /* Text button */
  .text-btn {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .text-btn:hover  { background: var(--surface-2); }
  .text-btn:active { background: var(--surface); }
  .text-btn.is-on  {
    background: var(--active);
    border-color: var(--active);
    color: #fff;
  }

  /* Center group spacing */
  .center {
    flex: 0 0 auto;
    gap: 6px;
  }

  /* Right cluster */
  .right {
    gap: 8px;
  }

  /* Transforms cluster — only visible for webcam/webrtc */
  #transforms { display: none; }
  #transforms.show { display: flex; }

  /* Rotation pill */
  .pill {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    min-width: 42px;
    justify-content: center;
  }

  /* Divider */
  .divider {
    width: 1px;
    height: 22px;
    background: var(--border);
    margin: 0 6px;
  }
</style>
</head>
<body>
  <div id="bar">
    <!-- Left: frame counter -->
    <div class="group">
      <span class="counter cur" id="cur">0</span>
    </div>

    <!-- Center: transport -->
    <div class="group center">
      <button class="icon-btn" id="btn-start" title="Jump to start" aria-label="Jump to start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="5" y="6" width="2.5" height="12" rx="1"/>
          <path d="M19 6.5L9.5 12L19 17.5V6.5Z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-back" title="−30 frames" aria-label="Back 30 frames">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 6.5L4 12L13 17.5V6.5Z"/>
          <path d="M22 6.5L13 12L22 17.5V6.5Z"/>
        </svg>
      </button>

      <button class="play-btn" id="btn-play" title="Play / Stop" aria-label="Play / Stop">
        <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.5V18.5L19 12L8 5.5Z"/>
        </svg>
      </button>

      <button class="icon-btn" id="btn-fwd" title="+30 frames" aria-label="Forward 30 frames">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 6.5L11 12L2 17.5V6.5Z"/>
          <path d="M11 6.5L20 12L11 17.5V6.5Z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-end" title="Jump to end" aria-label="Jump to end">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 6.5L14.5 12L5 17.5V6.5Z"/>
          <rect x="16.5" y="6" width="2.5" height="12" rx="1"/>
        </svg>
      </button>
    </div>

    <!-- Right: transforms (conditional) + loop + counter -->
    <div class="group right">
      <div class="group" id="transforms">
        <span class="group-label">Transform</span>
        <button class="icon-btn" id="btn-rot-ccw" title="Rotate counter-clockwise">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 4 4 9 9 14"/>
            <path d="M20 20a8 8 0 0 0-8-8H4"/>
          </svg>
        </button>
        <span class="pill" id="rot-label">0°</span>
        <button class="icon-btn" id="btn-rot-cw" title="Rotate clockwise">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 4 20 9 15 14"/>
            <path d="M4 20a8 8 0 0 1 8-8h8"/>
          </svg>
        </button>
        <span class="divider"></span>
        <button class="icon-btn" id="btn-flip-h" title="Flip horizontal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18"/>
            <path d="M16 7l4 5-4 5V7z" fill="currentColor"/>
            <path d="M8 7L4 12l4 5V7z" fill="currentColor" fill-opacity="0.4"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-flip-v" title="Flip vertical">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h18"/>
            <path d="M7 8l5-4 5 4H7z" fill="currentColor"/>
            <path d="M7 16l5 4 5-4H7z" fill="currentColor" fill-opacity="0.4"/>
          </svg>
        </button>
      </div>

      <button class="text-btn" id="btn-loop" title="Toggle loop">Loop</button>
      <span class="counter max" id="max">0</span>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
  (function () {
    'use strict';

    const $ = (id) => document.getElementById(id);

    const els = {
      cur:        $('cur'),
      max:        $('max'),
      play:       $('btn-play'),
      playIcon:   $('play-icon'),
      start:      $('btn-start'),
      back:       $('btn-back'),
      fwd:        $('btn-fwd'),
      end:        $('btn-end'),
      loop:       $('btn-loop'),
      transforms: $('transforms'),
      rotLabel:   $('rot-label'),
      rotCcw:     $('btn-rot-ccw'),
      rotCw:      $('btn-rot-cw'),
      flipH:      $('btn-flip-h'),
      flipV:      $('btn-flip-v'),
    };

    const PLAY_ICON = '<path d="M8 5.5V18.5L19 12L8 5.5Z"/>';
    const STOP_ICON = '<rect x="6" y="6" width="12" height="12" rx="2"/>';

    function setPlay(on) {
      els.play.classList.toggle('is-on', !!on);
      els.playIcon.innerHTML = on ? STOP_ICON : PLAY_ICON;
      els.play.title = on ? 'Stop' : 'Play';
    }

    function setLoop(on) {
      els.loop.classList.toggle('is-on', !!on);
    }

    function setCounters(cur, max) {
      els.cur.textContent = (cur ?? 0).toString();
      els.max.textContent = (max ?? 0).toString();
    }

    function setTransforms(visible, rotation, flipH, flipV) {
      els.transforms.classList.toggle('show', !!visible);
      els.rotLabel.textContent = `${rotation || 0}°`;
      els.flipH.classList.toggle('is-on', !!flipH);
      els.flipV.classList.toggle('is-on', !!flipV);
    }

    // ── Wire buttons (deferred until bridge is ready) ───────────────────
    let bridge = null;
    const pending = [];

    function call(method, ...args) {
      if (bridge && typeof bridge[method] === 'function') {
        bridge[method](...args);
      } else {
        pending.push([method, args]);
      }
    }

    els.start.addEventListener('click', () => call('jumpStart'));
    els.back .addEventListener('click', () => call('stepBack'));
    els.fwd  .addEventListener('click', () => call('stepFwd'));
    els.end  .addEventListener('click', () => call('jumpEnd'));
    els.play .addEventListener('click', () => call('togglePlay'));
    els.loop .addEventListener('click', () => call('toggleLoop'));
    els.rotCcw.addEventListener('click', () => call('rotateCcw'));
    els.rotCw .addEventListener('click', () => call('rotateCw'));
    els.flipH .addEventListener('click', () => call('toggleFlipH'));
    els.flipV .addEventListener('click', () => call('toggleFlipV'));

    // ── QWebChannel hookup ──────────────────────────────────────────────
    function applyState(s) {
      try {
        if (typeof s === 'string') s = JSON.parse(s);
      } catch (e) { return; }
      setCounters(s.current_frame, s.max_frame);
      setPlay(!!s.is_playing);
      setLoop(!!s.loop_enabled);
      setTransforms(
        !!s.transforms_visible,
        s.rotation || 0,
        !!s.flip_h,
        !!s.flip_v
      );
    }

    function init() {
      if (typeof QWebChannel === 'undefined' || !window.qt || !qt.webChannelTransport) {
        // Retry — page may load before transport is wired.
        return setTimeout(init, 50);
      }
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.controls;
        if (!bridge) return;

        if (bridge.stateChanged && bridge.stateChanged.connect) {
          bridge.stateChanged.connect(applyState);
        }

        // Flush any queued clicks
        while (pending.length) {
          const [m, a] = pending.shift();
          if (typeof bridge[m] === 'function') bridge[m](...a);
        }

        // Ask for initial state
        if (typeof bridge.requestState === 'function') {
          bridge.requestState();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
